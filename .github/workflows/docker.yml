name: Docker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - docker-compose.yml
      - docker/**
      - requirements.txt
      - conformity/**
      - oxomium/**
      - manage.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - docker-compose.yml
      - docker/**
      - requirements.txt
      - conformity/**
      - oxomium/**
      - manage.py

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: oxomium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Django system checks
        run: docker run --rm --entrypoint python oxomium:ci manage.py check

      - name: Verify fixed Python package versions
        run: >-
          docker run --rm --entrypoint python oxomium:ci -c
          "from importlib.metadata import version;
          assert version('msgpack') == '1.2.1';
          assert version('setuptools') == '84.0.0'"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: oxomium:ci
          ignorefile: .trivyignore
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
