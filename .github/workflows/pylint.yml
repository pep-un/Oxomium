name: Pylint
permissions:
  contents: read

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install project dependencies
      run: |
        pip install --only-binary=:all: -r requirements.txt 
    - name: Install pylint
      run: |
        python -m pip install --only-binary=:all: --upgrade pip
        pip install --only-binary=:all: pylint-django
    - name: Analysing the code with pylint
      run: |
        pylint -E --load-plugins pylint_django --django-settings-module=oxomium --ignore-paths='.*/migrations/' --ignore=__init__.py,manage.py $(git ls-files '*.py')
