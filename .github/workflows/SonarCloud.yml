name: SonarCloud
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Skip SonarCloud when no token is available
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is unavailable in this event; skipping SonarCloud analysis."
      - name: Install Dependencies
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          python -m pip install --upgrade --only-binary=:all: pip
          pip install --only-binary=:all: -r requirements.txt
          pip install --only-binary=:all: coverage
      - name: Run coverage test
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          coverage run manage.py test
          coverage xml
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
