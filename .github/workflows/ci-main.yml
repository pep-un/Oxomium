name: CI · Main Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    name: Django (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary=:all: pip
          pip install --only-binary=:all: -r requirements.txt
      - name: Run tests
        run: python manage.py test
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

  pylint:
    name: Pylint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary=:all: pip
          pip install --only-binary=:all: -r requirements.txt pylint-django
      - name: Analyse Python code
        run: >-
          pylint -E --load-plugins pylint_django
          --django-settings-module=oxomium
          --ignore-paths='.*/migrations/'
          --ignore=__init__.py,manage.py
          $(git ls-files '*.py')

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require SonarCloud token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN is required for SonarCloud analysis."
          exit 1
      - name: Set up Python 3.12
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          python -m pip install --upgrade --only-binary=:all: pip
          pip install --only-binary=:all: -r requirements.txt coverage
      - name: Run coverage tests
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          coverage run manage.py test
          coverage xml
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker_validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build Compose web image
        run: docker compose --project-name oxomium-ci build web
      - name: Tag validated image
        run: |
          set -euo pipefail
          image_id="$(docker compose --project-name oxomium-ci images -q web)"
          test -n "$image_id"
          docker image tag "$image_id" oxomium:ci
      - name: Run Django system checks
        run: docker run --rm --entrypoint python oxomium:ci manage.py check
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: oxomium:ci
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report-main
          path: trivy-report.json
      - name: Fail on high or critical vulnerabilities
        run: |
          findings="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-report.json)"
          if [ "$findings" -gt 0 ]; then
            jq '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | {
              target: .Target,
              package: .PkgName,
              installed: .InstalledVersion,
              fixed: .FixedVersion,
              severity: .Severity,
              vulnerability: .VulnerabilityID
            }' trivy-report.json
            exit 1
          fi
      - name: Start Compose services and smoke test
        run: |
          set -euo pipefail
          trap 'docker compose --project-name oxomium-ci down --volumes --remove-orphans' EXIT
          if ! docker compose --project-name oxomium-ci up --no-build --detach --wait --wait-timeout 60; then
            docker compose --project-name oxomium-ci logs
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/static/admin/css/base.css \
            > /dev/null
