<nav aria-label="Breadcrumb" class="app-breadcrumb mb-3">
    <ol class="breadcrumb flex-nowrap overflow-x-auto align-items-center">
        <li class="breadcrumb-item text-nowrap">
            <a href="{% url 'conformity:home' %}" class="app-breadcrumb-link" aria-label="Home" title="Home">
                <i class="bi bi-house-door-fill" aria-hidden="true"></i>
            </a>
        </li>
        {% for item in breadcrumb_items %}
            {% if forloop.last %}
                <li class="breadcrumb-item active text-nowrap" aria-current="page">{{ item.label }}</li>
            {% else %}
                <li class="breadcrumb-item text-nowrap">
                    <a href="{{ item.url }}" class="app-breadcrumb-link">{{ item.label }}</a>
                </li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
