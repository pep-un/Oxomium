<div class="card border-info mb-3" id="{{ panel_id|default:'attachments' }}">
    <div class="card-header bg-info-subtle d-flex align-items-center justify-content-between gap-2">
        <span class="fw-semibold">
            <i class="bi bi-paperclip me-1" aria-hidden="true"></i>
            Attachments
        </span>
        <span class="badge text-bg-info">{{ attachments|length }}</span>
    </div>
    <ul class="list-group list-group-flush">
        {% for attachment in attachments %}
            <li class="list-group-item d-flex align-items-center justify-content-between gap-3">
                <div class="text-truncate">
                    {% include "includes/attachment_link.html" with attachment=attachment %}
                </div>
                {% if editable %}
                    <form method="post"
                          action="{% url 'conformity:attachment_unlink' owner_type owner.pk attachment.pk %}"
                          class="flex-shrink-0">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-sm btn-outline-danger"
                                title="Remove attachment"
                                aria-label="Remove {{ attachment }}">
                            <i class="bi bi-trash" aria-hidden="true"></i>
                        </button>
                    </form>
                {% endif %}
            </li>
        {% empty %}
            <li class="list-group-item text-body-secondary">
                <i class="bi bi-file-earmark me-1" aria-hidden="true"></i>
                No attachment
            </li>
        {% endfor %}
    </ul>
</div>
