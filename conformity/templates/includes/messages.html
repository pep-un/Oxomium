{% if messages %}
<div class="app-messages" aria-label="Notifications">
    {% for message in messages %}
        <div
            class="alert {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}alert-success{% elif message.level == DEFAULT_MESSAGE_LEVELS.INFO %}alert-info{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-warning{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert-danger{% else %}alert-secondary{% endif %} alert-dismissible fade show app-message position-relative overflow-hidden d-flex align-items-center"
            role="{% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert{% else %}status{% endif %}"
            data-auto-dismiss="{% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS or message.level == DEFAULT_MESSAGE_LEVELS.INFO %}10000{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}30000{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}60000{% else %}10000{% endif %}">
            <i class="bi {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}bi-check-circle-fill{% elif message.level == DEFAULT_MESSAGE_LEVELS.INFO %}bi-info-circle-fill{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}bi-exclamation-triangle-fill{% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}bi-x-octagon-fill{% else %}bi-chat-left-text-fill{% endif %} me-2" aria-hidden="true"></i>
            <span class="me-4">{{ message }}</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <div class="app-message-timer" aria-hidden="true"></div>
        </div>
    {% endfor %}
</div>
{% endif %}
