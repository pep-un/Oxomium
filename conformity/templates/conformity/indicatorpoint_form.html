{% extends "conformity/main.html" %}
{% load ui_tags %}
{% load django_bootstrap5 %}

{% block header %}
<h1 class="h1 d-flex align-items-center gap-2">
    <a href="{% url 'conformity:indicator_detail' indicatorpoint.indicator.pk %}" class="header-back-link" aria-label="Back to indicator" title="Back to indicator">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </a>
    {{ indicatorpoint.indicator.name }}
</h1>
{% endblock %}

{% block content %}

    <form class="form" method="post" action="">
        {% csrf_token %}
        <div class="row justify-content-center">
            <div class="col col-6">
                {% bootstrap_form form %}
                {% bootstrap_button button_type="submit" content="Save" %}
            </div>
        </div>
    </form>
{% endblock %}
