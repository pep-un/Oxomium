{% extends "conformity/main.html" %}
{% load django_bootstrap5 %}

{% block header %}
<h1 class="h1 d-flex align-items-center gap-2">
    <i class="bi bi-pencil-square" aria-hidden="true"></i>
    Edit evidence
</h1>
{% endblock %}

{% block content %}
<form method="post" class="form">
    {% csrf_token %}
    <div class="card">
        <div class="card-header">
            <strong>{{ object.get_source_type_display }}</strong>
        </div>
        <div class="card-body">
            {% bootstrap_form form %}
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save" aria-hidden="true"></i> Save
        </button>
        <a class="btn btn-outline-secondary" href="{% url 'conformity:evidence_detail' object.pk %}">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
