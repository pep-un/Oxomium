services:
    web:
        build:
            context: .
        expose:
            - "8000"
        volumes:
            - .:/app
            - dbdata:/app/data
            - staticfiles:/app/staticfiles
        env_file:
            - ./env-exemple
        networks:
            - oxomium
        healthcheck:
            test: ["CMD", "python", "manage.py", "check"]
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "3000:80"
        volumes:
            - ./docker/nginx/oxomium.conf:/etc/nginx/conf.d/default.conf:ro
            - staticfiles:/staticfiles:ro
        depends_on:
            web:
                condition: service_healthy
        networks:
            - oxomium
        healthcheck:
            test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    oxomium:

volumes:
    dbdata:
    staticfiles:
