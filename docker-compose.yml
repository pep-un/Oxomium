services:
    web:
        build:
            context: .
        expose:
            - "8000"
        volumes:
            - dbdata:/app/data
            - staticfiles:/app/staticfiles
        env_file:
            - ./env-exemple
        networks:
            - oxomium
        healthcheck:
            test: ["CMD", "python", "manage.py", "check"]
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:alpine
        ports:
            - "3000:80"
        volumes:
            - ./docker/nginx/oxomium.conf:/etc/nginx/conf.d/default.conf:ro
            - staticfiles:/staticfiles:ro
        depends_on:
            web:
                condition: service_healthy
        networks:
            - oxomium
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --quiet --output-document=/dev/null http://localhost/nginx-health",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    oxomium:

volumes:
    dbdata:
    staticfiles:
