services:
  web:
    build:
      context: .
    expose:
      - "8000"
    volumes:
      - dbdata:/app/data
      - staticfiles:/app/staticfiles
    env_file:
      - ./.env
    networks:
      - oxomium
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx/container.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - oxomium
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  oxomium:

volumes:
  dbdata:
  staticfiles:
