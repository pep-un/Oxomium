services:
  web:
    image: docker.io/pepun/oxomium:${OXOMIUM_VERSION}
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - dbdata:/app/data
      - staticfiles:/app/staticfiles
    networks:
      - oxomium
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - oxomium
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  oxomium:

volumes:
  dbdata:
  staticfiles:
